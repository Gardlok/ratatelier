name: Bootstrap Ratatelier source

# This workflow removes itself after reconstructing the checked source archive.
on:
  push:
    branches: ["agent/ratatelier-workbench"]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ratatelier-workbench
          fetch-depth: 0
      - name: Reconstruct source
        shell: bash
        run: |
          cat .bootstrap/part-* | base64 --decode > /tmp/ratatelier-source.tar.gz
          echo "db09c551bdca76abbebefbc02df958ad17f43212f5fbaa35991746bed8704a4c  /tmp/ratatelier-source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/ratatelier-source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Ratatelier workbench"
          git push origin HEAD:agent/ratatelier-workbench
